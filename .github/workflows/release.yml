name: Release editor

on:
  push:
    tags: ['editor-v*.*.*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: editor-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_USERCONFIG: /tmp/aihu-editor-npmrc-oidc-only

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - name: Prepare OIDC-only npm config
        run: printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
      - name: Pin npm for trusted publishing
        run: npm install --global npm@11.5.1 --ignore-scripts
      - run: bun install --frozen-lockfile
      - name: Validate exact tag and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "editor-v$(node -p "require('./package.json').version")"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
      - name: Build and test
        run: bun run check:ci
      - name: Reject classic npm authentication
        run: node scripts/check-oidc-auth.mjs
      - name: Confirm registry returns E404 only
        run: node scripts/assert-unpublished.mjs
      - name: Capture and validate one exact tarball
        env:
          PACK_DIR: ${{ runner.temp }}/aihu-editor-pack
        run: node scripts/verify-pack.mjs
      - name: Validate isolated consumer
        run: node scripts/consumer-smoke.mjs "$AIHU_PACK_PATH"
      - name: Publish exact validated tarball with OIDC provenance
        run: npm publish "$AIHU_PACK_PATH" --access public --provenance --registry "$NPM_CONFIG_REGISTRY"
